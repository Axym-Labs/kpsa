[project]
name = "kpsa"
version = "0.1.0"
description = "Kernelized Parameter-Sensitivity Atlas experiments and analysis tools"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "torch",
  "torchvision",
  "transformers",
  "scikit-learn",
  "pandas",
  "matplotlib",
  "timm",
]

[project.optional-dependencies]
timeseries = ["chronos-forecasting==2.2.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
